services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xsmb
      POSTGRES_USER: xsmb
      POSTGRES_PASSWORD: xsmb_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  scraper:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+asyncpg://xsmb:xsmb_secret@db:5432/xsmb
    volumes:
      - ./exports:/app/exports

volumes:
  pgdata:
